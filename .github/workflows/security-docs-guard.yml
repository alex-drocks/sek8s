name: Security Docs Guard

on:
  push:
    paths:
      - 'docs/security/**'
      - 'SECURITY.md'
      - 'scripts/security/**'
      - 'makefiles/security.mk'
  pull_request:
    branches: [main, 'release/**']

permissions:
  contents: write

jobs:
  scrub-push:
    if: github.event_name == 'push' && github.repository == 'chutesai/sek8s'
    runs-on: ubuntu-latest
    steps:
      - name: Delete branch with sensitive files
        if: github.ref_name != github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::error::Sensitive security documents detected on branch ${{ github.ref_name }}. Deleting branch."
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/${{ github.ref_name }}" || true
          exit 1

      - name: Fail on protected branch
        if: github.ref_name == github.event.repository.default_branch
        run: |
          echo "::error::Sensitive security documents pushed to ${{ github.ref_name }}. This should never happen -- investigate immediately."
          exit 1

  check-pr:
    if: github.event_name == 'pull_request' && github.repository == 'chutesai/sek8s'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for sensitive files
        run: |
          sensitive_paths_file=".security-sensitive-paths"
          found=""

          if [[ -f "$sensitive_paths_file" ]]; then
            while IFS= read -r pattern; do
              [[ -z "$pattern" || "$pattern" == \#* ]] && continue
              pattern="$(echo "$pattern" | sed 's:/*$::')"
              matches=$(find . -path "./.git" -prune -o -path "./${pattern}*" -print 2>/dev/null || true)
              if [[ -n "$matches" ]]; then
                found="${found}${matches}\n"
              fi
            done < "$sensitive_paths_file"
          fi

          if [[ -n "$found" ]]; then
            echo "::error::Sensitive security documents found in this PR:"
            echo -e "$found"
            echo ""
            echo "Security documents must remain in the private repository only."
            exit 1
          fi

          echo "No sensitive files detected."
